title: Tom Donohue's Blog
name: Tom Donohue # Person who runs this site (for social graph)
author: Tom Donohue
email: monodot@gmail.com
url: "https://monodot.co.uk"
baseurl: # the subpath of your site, e.g. "/blog"
description: > # this means to ignore newlines until "show_excerpts:"
  Tom's personal blog, sharing what I'm up to, opinions, and stuff I'm working on.
avatar: /assets/img/me-avatar.jpg

show_excerpts: false # set to true to show excerpts on the homepage
locale: en_GB
permalink: /:title/

collections:
  # Notes = the microblog: short posts, links, things I'm reading.
  notes:
    output: true
    permalink: /notes/:title/

twitter_username:   monodot
github_username:    monodot

social:
  type                   : # Person or Organization (defaults to Person)
  name                   : # If the user or organization name differs from the site's name
  links:
    - https://twitter.com/monodot

include: ["_pages"]

exclude:
  - "*.sh"
  - README.md

defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: "_pages"
      type: "pages"
    values:
      permalink: /:basename/
  - scope:
      path: ""
      type: "notes"
    values:
      layout: "note"

# If you want to link only specific pages in your header, uncomment
# this and add the path to the pages in order as they should show up
#header_pages:
# - about.md

paginate:           5
paginate_path:      "/posts/page:num/"
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap ## Uncomment this line to silently generate a sitemaps.org compliant sitemap for your Jekyll site
  - jekyll-tidy

# Notes get their own feed at /notes/feed.xml, separate from /feed.xml.
# This is the only hook needed to syndicate them elsewhere later.
feed:
  collections:
    notes:
      path: "/notes/feed.xml"

sass:
  sass_dir: _sass
  style: compressed  # This will minify your CSS in production

footer:
  copyright: ""

jekyll_tidy:
  ignore_env: development
  exclude:
    - '**/*.scss'
    - '**/*.js'
